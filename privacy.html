<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08050d"><title>결정제물함 개인정보처리방침</title><style>body{margin:0;background:#08050d;color:#eee6ef;font-family:"Courier New","Malgun Gothic",monospace}.wrap{width:min(760px,calc(100% - 32px));margin:40px auto;padding:32px;border:1px solid #6d4673;background:#100918;box-shadow:0 0 0 4px #030205}h1,h2{font-family:Georgia,"Malgun Gothic",serif;font-weight:normal;color:#ead9ec}p,li{color:#ad9db1;line-height:1.85}a{color:#d28cdf}.back{display:inline-block;margin-bottom:24px}</style></head><body><main class="wrap"><a class="back" href="index.html">← 제물함으로 돌아가기</a><h1>개인정보처리방침 초안</h1><p>현재 버전의 결정제물함은 사용자가 입력한 고민과 선택지를 서버로 전송하거나 저장하지 않습니다. 모든 처리는 사용자의 브라우저 안에서 이루어집니다.</p><h2>광고 및 분석 도구</h2><p>향후 광고 또는 방문 통계 도구를 적용할 경우, 해당 서비스가 쿠키나 기기 정보를 사용할 수 있습니다. 실제 서비스를 공개할 때 사용 중인 광고·분석 서비스와 수집 항목을 이 문서에 구체적으로 기재해야 합니다.</p><h2>문의</h2><p>공개 배포 전에 실제 문의 수단을 추가해 주세요.</p></main></body></html>
